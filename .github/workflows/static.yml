name: Validate VBI NEW PRO
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate JSON files
        run: python -m json.tool assets/data/questions.json > /dev/null && python -m json.tool assets/data/manifest.json > /dev/null
      - name: Check JavaScript syntax
        run: node --check assets/js/app.js && node --check tests/validation.js
      - name: Check required app files
        run: test -s index.html && test -s assets/css/style.css && test -s assets/js/app.js
      - name: Validate question data
        run: node tests/validation.js
